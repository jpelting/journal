name: Generate What's New announcements

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Open a proxy to the production database
        run: |
          flyctl proxy 5432:5432 -a thewaxtablet-db &
          for i in $(seq 1 15); do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break
            sleep 1
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Draft announcements from new commits
        run: uv run manage.py generate_announcements
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
