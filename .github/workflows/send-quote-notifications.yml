name: Send due quote notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-due-quote-notifications
        run: |
          curl -fsS -X POST "https://www.thewaxtablet.com/internal/send-due-quote-notifications/" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
