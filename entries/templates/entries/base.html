<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}The Wax Tablet{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            {% include "entries/_theme_vars.html" %}
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 760px;
            margin: 0 auto;
            padding: 1.5rem 1rem 4rem;
            line-height: 1.5;
            color: var(--text);
            background: var(--bg);
        }
        body.wide { max-width: 1200px; }
        a { color: var(--accent); }
        nav {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem 1.25rem;
        }
        nav a { text-decoration: none; font-weight: bold; }
        nav .nav-user { margin-left: auto; color: var(--text-muted); font-weight: normal; }
        nav .logout-form button {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
        }
        h1, h2, h3 { font-family: 'Cinzel', Georgia, 'Times New Roman', serif; letter-spacing: 0.03em; }
        section.part {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            background: var(--wax-surface);
            box-shadow: var(--engrave-shadow), 0 1px 3px var(--shadow);
        }
        section.part h2 { margin-top: 0; font-size: 1.1rem; color: var(--accent); }
        section.part h3 { font-size: 0.95rem; color: var(--accent); margin-bottom: 0.25rem; }
        label { display: block; margin-top: 0.75rem; font-weight: bold; }
        input[type=text], input[type=date], input[type=number], textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem 0.6rem;
            margin-top: 0.25rem;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            transition: border-color 0.15s ease;
            cursor: var(--stylus-cursor);
        }
        input[type=text]:focus, input[type=date]:focus, input[type=number]:focus, textarea:focus, select:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
            border-color: var(--accent);
        }
        .dictate-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-top: 0.4rem;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .dictate-btn:hover { border-color: var(--accent); color: var(--accent); }
        .dictate-btn.listening {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--accent-contrast);
            animation: dictate-pulse 1.2s ease-in-out infinite;
        }
        @keyframes dictate-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        @keyframes wax-press {
            0% { box-shadow: 0 0 0 0 rgba(198, 139, 69, 0.45); }
            40% { box-shadow: 0 0 8px 2px rgba(198, 139, 69, 0.35); }
            100% { box-shadow: 0 0 0 0 rgba(198, 139, 69, 0); }
        }
        textarea.wax-pulse, input[type=text].wax-pulse { animation: wax-press 0.25s ease-out; }
        input.slider { width: 100%; accent-color: var(--accent); }
        .slider-row { display: flex; align-items: center; gap: 0.75rem; }
        .slider-row output { min-width: 1.5rem; text-align: right; font-weight: bold; }
        .journals-title { text-align: center; }
        .journal-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1.5rem; }
        .journal-tile {
            display: block;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            background: var(--surface);
            text-decoration: none;
            color: inherit;
            box-shadow: var(--engrave-shadow), 0 1px 3px var(--shadow);
            transition: border-color 0.15s ease, transform 0.15s ease;
        }
        .journal-tile:hover { border-color: var(--accent); transform: translateY(-1px); }
        .journal-tile h2 { margin: 0 0 0.35rem; font-size: 1.05rem; color: var(--accent); }
        .journal-tile p { margin: 0; }
        @media (max-width: 600px) { .journal-tiles { grid-template-columns: 1fr; } }

        .entry-list { list-style: none; padding: 0; }
        .entry-list li { padding: 0.5rem 0; border-bottom: 1px solid var(--border-subtle); }
        .scores { color: var(--text-muted); font-size: 0.9rem; }
        .btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.6rem 1.2rem;
            background: var(--accent);
            color: var(--accent-contrast);
            text-decoration: none;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-family: 'Cinzel', Georgia, serif;
            letter-spacing: 0.04em;
            cursor: pointer;
            box-shadow: 0 0 16px 1px rgba(198, 139, 69, 0.35);
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }
        .btn:hover { background: var(--accent-hover); box-shadow: 0 0 22px 3px rgba(198, 139, 69, 0.5); }
        .link-btn {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: var(--accent);
            text-decoration: underline;
            cursor: pointer;
        }
        .prompt { font-style: italic; color: var(--accent); margin-top: 0.25rem; }
        .helptext { font-size: 0.85rem; color: var(--text-muted); }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: 0.5rem; }
        .calendar-nav a { font-size: 1.1rem; padding: 0.3rem 0.6rem; }
        .calendar-scroll { overflow-x: auto; }
        table.calendar { width: 100%; min-width: 560px; border-collapse: collapse; table-layout: fixed; box-shadow: var(--engrave-shadow); }
        table.calendar th { padding: 0.6rem 0; font-size: 0.95rem; color: var(--text-muted); border-bottom: 1px solid var(--border); }
        table.calendar td { border: 1px solid var(--border-subtle); height: 8rem; vertical-align: top; padding: 0.5rem; }
        table.calendar td.cal-empty { background: var(--bg-subtle); border-color: var(--bg-subtle); }
        table.calendar td.today { outline: 3px solid var(--accent); outline-offset: -3px; }
        table.calendar td a { text-decoration: none; font-weight: bold; color: var(--text); font-size: 1.15rem; }
        table.calendar td .cal-add { color: var(--text-muted); font-weight: normal; }
        table.calendar .cal-scores { font-size: 0.85rem; color: var(--accent); margin-top: 0.4rem; line-height: 1.4; }
        /* Mood-color cells always get a pale swatch background regardless of site theme,
           so their text needs a fixed dark color rather than the theme-aware default above. */
        table.calendar td.has-mood-bg a { color: #2b2b28; }
        table.calendar td.has-mood-bg .cal-scores { color: #47372a; }
        @media (max-width: 600px) {
            table.calendar td { height: 5.5rem; padding: 0.35rem; }
            table.calendar td a { font-size: 1rem; }
            table.calendar .cal-scores { font-size: 0.75rem; }
        }
        .calendar-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); }
        .calendar-legend .legend-note { font-style: italic; }
        .legend-item { display: flex; align-items: center; gap: 0.4rem; }
        .legend-swatch {
            display: inline-block;
            width: 0.9rem;
            height: 0.9rem;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .checkin-tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .checkin-tabs a {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--engrave-shadow);
            text-decoration: none;
            font-weight: bold;
            color: var(--accent);
            transition: background 0.15s ease, color 0.15s ease;
        }
        .checkin-tabs a.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
        .checkin-tabs .btn-prayer {
            margin-left: auto;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent);
            cursor: pointer;
            transition: border-color 0.15s ease;
        }
        .checkin-tabs .btn-prayer:hover { border-color: var(--accent); }
        .tab-section { display: none; }
        .tab-section.active { display: block; }
        .checkin-header { text-align: center; margin-bottom: 1.5rem; }
        .checkin-meta { color: var(--text-muted); font-size: 0.9rem; margin-top: -0.5rem; }

        .weather-anim-wrap { margin: 0.5rem 0; }
        .weather-anim { vertical-align: middle; }

        .w-sun-rays { transform-origin: 32px 32px; animation: w-spin 16s linear infinite; }
        .w-sun-disc { transform-origin: 32px 32px; animation: w-pulse 3s ease-in-out infinite; }
        @keyframes w-spin { to { transform: rotate(360deg); } }
        @keyframes w-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        .w-cloud-front { transform-origin: center; animation: w-drift 6s ease-in-out infinite; }
        .w-cloud-back { transform-origin: center; animation: w-drift 8s ease-in-out infinite reverse; }
        @keyframes w-drift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }

        .w-drop { animation: w-fall 1s linear infinite; opacity: 0; }
        .w-drop-1 { animation-delay: 0s; }
        .w-drop-2 { animation-delay: 0.3s; }
        .w-drop-3 { animation-delay: 0.6s; }
        @keyframes w-fall {
            0% { transform: translateY(-4px); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: translateY(8px); opacity: 0; }
        }

        .w-flake { animation: w-flake-fall 2.4s linear infinite; opacity: 0; }
        .w-flake-1 { animation-delay: 0s; }
        .w-flake-2 { animation-delay: 0.6s; }
        .w-flake-3 { animation-delay: 1.2s; }
        @keyframes w-flake-fall {
            0% { transform: translate(0, -4px); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(3px, 14px); opacity: 0; }
        }

        .w-fog-line { animation: w-fog-drift 3s ease-in-out infinite; }
        .w-fog-1 { animation-delay: 0s; }
        .w-fog-2 { animation-delay: 0.4s; }
        .w-fog-3 { animation-delay: 0.8s; }
        @keyframes w-fog-drift {
            0%, 100% { transform: translateX(0); opacity: 0.6; }
            50% { transform: translateX(5px); opacity: 1; }
        }

        .w-bolt { animation: w-flash 3s ease-in-out infinite; transform-origin: center; }
        @keyframes w-flash {
            0%, 45%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
            55% { opacity: 0.35; }
            60% { opacity: 1; }
            70% { opacity: 0.25; }
        }
        .goal-row { margin-top: 0.5rem; }
        .goal-row input[type=text] { margin-top: 0; }
        .goal-check { display: flex; align-items: center; gap: 0.5rem; font-weight: normal; margin-top: 0.5rem; }
        .goal-check input { width: auto; margin: 0; }
        .emotion-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .emotion-chip {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            font-weight: normal;
            margin-top: 0;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }
        .emotion-chip:hover { border-color: var(--accent); }
        .emotion-chip input { width: auto; margin: 0; }

        .export-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border-subtle); }
        .export-row input[type=checkbox] { width: auto; margin: 0; }
        .export-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .messages { list-style: none; padding: 0; margin-bottom: 1.5rem; }
        .messages li { padding: 0.6rem 1rem; border-radius: 6px; background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: var(--overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 100;
        }
        .modal-backdrop[hidden] { display: none; }
        .modal {
            background: var(--wax-surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            max-width: 640px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem 1.75rem;
            position: relative;
            box-shadow: var(--engrave-shadow), 0 10px 40px var(--shadow);
        }
        .modal-close {
            position: absolute;
            top: 0.6rem;
            right: 0.9rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            color: var(--text-muted);
        }
        .modal h2 { margin-top: 0; }
        .modal h3 { margin-bottom: 0.25rem; color: var(--accent); font-size: 1rem; }
        @media (max-width: 600px) {
            .modal-backdrop { padding: 0.75rem; }
            .modal { padding: 1.1rem 1.25rem; }
        }
        @media (max-width: 600px) {
            nav { gap: 0.4rem 0.9rem; }
            table.calendar td { min-width: 4.5rem; }
        }
        .site-header { text-align: center; margin-top: 0.5rem; margin-bottom: 1.5rem; }
        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-family: 'Cinzel', Georgia, serif;
            color: var(--accent);
            letter-spacing: 0.08em;
            text-decoration: none;
            font-size: 2.25rem;
        }
        .wt-seal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.6rem;
            height: 1.6rem;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #3a2c1a 0%, #241a0f 70%);
            border: 1px solid var(--accent);
            box-shadow: var(--engrave-shadow);
            color: var(--accent);
            font-family: 'Cinzel', Georgia, serif;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            vertical-align: middle;
        }
        .site-header .wt-seal { width: 2.75rem; height: 2.75rem; font-size: 1rem; }
        @media (max-width: 600px) {
            .brand-mark { font-size: 1.6rem; }
            .site-header .wt-seal { width: 2.1rem; height: 2.1rem; font-size: 0.85rem; }
        }
        .type-medallion {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #4a3a24 0%, #241a0f 75%);
            border: 1px solid var(--border);
            box-shadow: var(--engrave-shadow), 0 1px 3px var(--shadow);
            color: var(--accent);
            margin-bottom: 0.6rem;
        }
        .checkin-tabs a .type-medallion, .entry-tabs a .type-medallion {
            width: 1.4rem;
            height: 1.4rem;
            margin: 0 0.4rem 0 0;
            vertical-align: middle;
        }
        .checkin-tabs a .type-medallion svg, .entry-tabs a .type-medallion svg { width: 16px; height: 16px; }
        .wipe-slate-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            background: linear-gradient(100deg,
                transparent 0%,
                rgba(198, 139, 69, 0.25) 45%,
                rgba(234, 229, 217, 0.15) 50%,
                rgba(198, 139, 69, 0.25) 55%,
                transparent 100%);
            background-size: 250% 100%;
            background-position: -120% 0;
        }
        .wipe-slate-overlay.active {
            opacity: 1;
            animation: wipe-sweep 0.65s ease-in-out forwards;
        }
        @keyframes wipe-sweep {
            0% { background-position: -120% 0; }
            100% { background-position: 120% 0; }
        }
        body.wiping-slate {
            animation: wipe-fade 0.65s ease-in-out forwards;
        }
        @keyframes wipe-fade {
            0% { opacity: 1; filter: blur(0); }
            50% { opacity: 0.35; filter: blur(1px); }
            100% { opacity: 0; filter: blur(2px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .wipe-slate-overlay, body.wiping-slate { animation: none !important; }
        }
    </style>
</head>
<body class="{% block bodyclass %}{% endblock %}">
    <header class="site-header">
        <a href="{% url 'entries:home' %}" class="brand-mark"><span class="wt-seal">WT</span>The Wax Tablet</a>
    </header>
    <nav>
        <a href="{% url 'entries:checkin' %}">Check-in</a>
        <a href="{% url 'entries:list' %}">Journals</a>
        <a href="{% url 'entries:calendar' %}">Calendar</a>
        <a href="{% url 'entries:export' %}">Export</a>
        <a href="/admin/">Admin</a>
        <span class="nav-user">{{ user.username }}</span>
        <form action="{% url 'logout' %}" method="post" class="logout-form">
            {% csrf_token %}
            <button type="submit">Log out</button>
        </form>
    </nav>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}<li>{{ message }}</li>{% endfor %}
        </ul>
    {% endif %}
    {% block content %}{% endblock %}
    <script>
        (function () {
            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            var stopActive = null;

            document.querySelectorAll('textarea').forEach(function (textarea) {
                var button = document.createElement('button');
                button.type = 'button';
                button.className = 'dictate-btn';
                button.textContent = '🎤 Dictate';
                button.setAttribute('aria-pressed', 'false');
                textarea.insertAdjacentElement('afterend', button);

                var recognition = null;
                var listening = false;
                var baseValue = '';

                function setListening(value) {
                    listening = value;
                    button.classList.toggle('listening', value);
                    button.setAttribute('aria-pressed', String(value));
                    button.textContent = value ? '● Listening… (tap to stop)' : '🎤 Dictate';
                    if (!value) stopActive = null;
                }

                function stop() {
                    if (recognition) recognition.stop();
                }

                function start() {
                    if (stopActive) stopActive();

                    recognition = new SpeechRecognition();
                    recognition.lang = document.documentElement.lang || 'en-US';
                    recognition.continuous = true;
                    recognition.interimResults = true;

                    baseValue = textarea.value;
                    if (baseValue && !/\s$/.test(baseValue)) baseValue += ' ';

                    recognition.onresult = function (event) {
                        var finalTranscript = '';
                        var interimTranscript = '';
                        for (var i = event.resultIndex; i < event.results.length; i++) {
                            var transcript = event.results[i][0].transcript;
                            if (event.results[i].isFinal) {
                                finalTranscript += transcript + ' ';
                            } else {
                                interimTranscript += transcript;
                            }
                        }
                        if (finalTranscript) baseValue += finalTranscript;
                        textarea.value = baseValue + interimTranscript;
                        textarea.dispatchEvent(new Event('input', { bubbles: true }));
                    };

                    recognition.onerror = function () { setListening(false); };
                    recognition.onend = function () { setListening(false); };

                    recognition.start();
                    stopActive = stop;
                    setListening(true);
                }

                button.addEventListener('click', function () {
                    if (listening) {
                        stop();
                    } else {
                        start();
                    }
                });
            });
        })();
    </script>
    <script>
        document.querySelectorAll('textarea, input[type=text]').forEach(function (field) {
            field.addEventListener('input', function () {
                field.classList.remove('wax-pulse');
                void field.offsetWidth;
                field.classList.add('wax-pulse');
            });
        });
    </script>
</body>
</html>
