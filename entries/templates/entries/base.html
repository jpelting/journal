<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Journal{% endblock %}</title>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', serif;
            max-width: 760px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem;
            line-height: 1.5;
            color: #2b2b28;
            background: #fbf9f4;
        }
        body.wide { max-width: 1200px; }
        a { color: #5b4636; }
        nav { margin-bottom: 2rem; border-bottom: 1px solid #ddd6c8; padding-bottom: 1rem; display: flex; align-items: center; }
        nav a { margin-right: 1rem; text-decoration: none; font-weight: bold; }
        nav .logout-form { margin-left: auto; }
        nav .logout-form button {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            font-weight: bold;
            color: #5b4636;
            text-decoration: none;
            cursor: pointer;
        }
        h1, h2, h3 { font-family: 'Georgia', serif; }
        section.part {
            border: 1px solid #ddd6c8;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            background: #fff;
        }
        section.part h2 { margin-top: 0; font-size: 1.1rem; color: #5b4636; }
        section.part h3 { font-size: 0.95rem; color: #5b4636; margin-bottom: 0.25rem; }
        label { display: block; margin-top: 0.75rem; font-weight: bold; }
        input[type=text], input[type=date], input[type=number], textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 0.4rem;
            margin-top: 0.25rem;
            font-family: inherit;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input.slider { width: 100%; }
        .slider-row { display: flex; align-items: center; gap: 0.75rem; }
        .slider-row output { min-width: 1.5rem; text-align: right; font-weight: bold; }
        .journals-title { text-align: center; }
        .journal-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1.5rem; }
        .journal-tile {
            display: block;
            border: 1px solid #ddd6c8;
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            background: #fff;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.15s ease;
        }
        .journal-tile:hover { border-color: #5b4636; }
        .journal-tile h2 { margin: 0 0 0.35rem; font-size: 1.05rem; color: #5b4636; }
        .journal-tile p { margin: 0; }
        @media (max-width: 480px) { .journal-tiles { grid-template-columns: 1fr; } }

        .entry-list { list-style: none; padding: 0; }
        .entry-list li { padding: 0.5rem 0; border-bottom: 1px solid #eee2cf; }
        .scores { color: #7a6a55; font-size: 0.9rem; }
        .btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.6rem 1.2rem;
            background: #5b4636;
            color: #fff;
            text-decoration: none;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        .prompt { font-style: italic; color: #5b4636; margin-top: 0.25rem; }
        .helptext { font-size: 0.85rem; color: #888; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .calendar-nav a { font-size: 1.1rem; padding: 0.3rem 0.6rem; }
        table.calendar { width: 100%; border-collapse: collapse; table-layout: fixed; }
        table.calendar th { padding: 0.6rem 0; font-size: 0.95rem; color: #7a6a55; border-bottom: 1px solid #ddd6c8; }
        table.calendar td { border: 1px solid #eee2cf; height: 8rem; vertical-align: top; padding: 0.5rem; }
        table.calendar td.cal-empty { background: #f3efe4; border-color: #f3efe4; }
        table.calendar td.today { outline: 3px solid #5b4636; outline-offset: -3px; }
        table.calendar td a { text-decoration: none; font-weight: bold; color: #2b2b28; font-size: 1.15rem; }
        table.calendar td .cal-add { color: #a99c86; font-weight: normal; }
        table.calendar .cal-scores { font-size: 0.85rem; color: #5b4636; margin-top: 0.4rem; line-height: 1.4; }
        .calendar-legend { display: flex; align-items: center; gap: 1rem; margin-top: 1rem; font-size: 0.85rem; color: #7a6a55; }
        .calendar-legend .legend-note { font-style: italic; }
        .legend-item { display: flex; align-items: center; gap: 0.4rem; }
        .legend-swatch {
            display: inline-block;
            width: 0.9rem;
            height: 0.9rem;
            border-radius: 4px;
            border: 1px solid #ddd6c8;
        }
        .checkin-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .checkin-tabs a {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            background: #fff;
            border: 1px solid #ddd6c8;
            text-decoration: none;
            font-weight: bold;
            color: #5b4636;
        }
        .checkin-tabs a.active { background: #5b4636; color: #fff; border-color: #5b4636; }
        .checkin-tabs .btn-prayer {
            margin-left: auto;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            background: #fff;
            border: 1px solid #ddd6c8;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            color: #5b4636;
            cursor: pointer;
        }
        .checkin-tabs .btn-prayer:hover { border-color: #5b4636; }
        .tab-section { display: none; }
        .tab-section.active { display: block; }
        .checkin-header { text-align: center; margin-bottom: 1.5rem; }
        .checkin-meta { color: #7a6a55; font-size: 0.9rem; margin-top: -0.5rem; }

        .weather-anim-wrap { margin: 0.5rem 0; }
        .weather-anim { vertical-align: middle; }

        .w-sun-rays { transform-origin: 32px 32px; animation: w-spin 16s linear infinite; }
        .w-sun-disc { transform-origin: 32px 32px; animation: w-pulse 3s ease-in-out infinite; }
        @keyframes w-spin { to { transform: rotate(360deg); } }
        @keyframes w-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        .w-cloud-front { transform-origin: center; animation: w-drift 6s ease-in-out infinite; }
        .w-cloud-back { transform-origin: center; animation: w-drift 8s ease-in-out infinite reverse; }
        @keyframes w-drift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }

        .w-drop { animation: w-fall 1s linear infinite; opacity: 0; }
        .w-drop-1 { animation-delay: 0s; }
        .w-drop-2 { animation-delay: 0.3s; }
        .w-drop-3 { animation-delay: 0.6s; }
        @keyframes w-fall {
            0% { transform: translateY(-4px); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: translateY(8px); opacity: 0; }
        }

        .w-flake { animation: w-flake-fall 2.4s linear infinite; opacity: 0; }
        .w-flake-1 { animation-delay: 0s; }
        .w-flake-2 { animation-delay: 0.6s; }
        .w-flake-3 { animation-delay: 1.2s; }
        @keyframes w-flake-fall {
            0% { transform: translate(0, -4px); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(3px, 14px); opacity: 0; }
        }

        .w-fog-line { animation: w-fog-drift 3s ease-in-out infinite; }
        .w-fog-1 { animation-delay: 0s; }
        .w-fog-2 { animation-delay: 0.4s; }
        .w-fog-3 { animation-delay: 0.8s; }
        @keyframes w-fog-drift {
            0%, 100% { transform: translateX(0); opacity: 0.6; }
            50% { transform: translateX(5px); opacity: 1; }
        }

        .w-bolt { animation: w-flash 3s ease-in-out infinite; transform-origin: center; }
        @keyframes w-flash {
            0%, 45%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
            55% { opacity: 0.35; }
            60% { opacity: 1; }
            70% { opacity: 0.25; }
        }
        .goal-row { margin-top: 0.5rem; }
        .goal-row input[type=text] { margin-top: 0; }
        .goal-check { display: flex; align-items: center; gap: 0.5rem; font-weight: normal; margin-top: 0.5rem; }
        .goal-check input { width: auto; margin: 0; }
        .emotion-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .emotion-chip {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.8rem;
            border: 1px solid #ddd6c8;
            border-radius: 999px;
            background: #fff;
            font-weight: normal;
            margin-top: 0;
            cursor: pointer;
        }
        .emotion-chip input { width: auto; margin: 0; }

        .export-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #eee2cf; }
        .export-row input[type=checkbox] { width: auto; margin: 0; }
        .export-actions { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .messages { list-style: none; padding: 0; margin-bottom: 1.5rem; }
        .messages li { padding: 0.6rem 1rem; border-radius: 6px; background: #f8d7da; color: #7a2e2e; border: 1px solid #f1b0b7; }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(43, 43, 40, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 100;
        }
        .modal-backdrop[hidden] { display: none; }
        .modal {
            background: #fbf9f4;
            border-radius: 8px;
            max-width: 640px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem 1.75rem;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }
        .modal-close {
            position: absolute;
            top: 0.6rem;
            right: 0.9rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            color: #7a6a55;
        }
        .modal h2 { margin-top: 0; }
        .modal h3 { margin-bottom: 0.25rem; color: #5b4636; font-size: 1rem; }
    </style>
</head>
<body class="{% block bodyclass %}{% endblock %}">
    <nav>
        <a href="{% url 'entries:checkin' %}">Check-in</a>
        <a href="{% url 'entries:list' %}">Journals</a>
        <a href="{% url 'entries:calendar' %}">Calendar</a>
        <a href="{% url 'entries:export' %}">Export</a>
        <a href="/admin/">Admin</a>
        <form action="{% url 'logout' %}" method="post" class="logout-form">
            {% csrf_token %}
            <button type="submit">Log out</button>
        </form>
    </nav>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}<li>{{ message }}</li>{% endfor %}
        </ul>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
