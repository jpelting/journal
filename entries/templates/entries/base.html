<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Journal{% endblock %}</title>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', serif;
            max-width: 760px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem;
            line-height: 1.5;
            color: #2b2b28;
            background: #fbf9f4;
        }
        a { color: #5b4636; }
        nav { margin-bottom: 2rem; border-bottom: 1px solid #ddd6c8; padding-bottom: 1rem; }
        nav a { margin-right: 1rem; text-decoration: none; font-weight: bold; }
        h1, h2, h3 { font-family: 'Georgia', serif; }
        section.part {
            border: 1px solid #ddd6c8;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            background: #fff;
        }
        section.part h2 { margin-top: 0; font-size: 1.1rem; color: #5b4636; }
        label { display: block; margin-top: 0.75rem; font-weight: bold; }
        input[type=text], input[type=date], input[type=number], textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 0.4rem;
            margin-top: 0.25rem;
            font-family: inherit;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input.slider { width: 100%; }
        .slider-row { display: flex; align-items: center; gap: 0.75rem; }
        .slider-row output { min-width: 1.5rem; text-align: right; font-weight: bold; }
        .entry-list { list-style: none; padding: 0; }
        .entry-list li { padding: 0.5rem 0; border-bottom: 1px solid #eee2cf; }
        .scores { color: #7a6a55; font-size: 0.9rem; }
        .btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.6rem 1.2rem;
            background: #5b4636;
            color: #fff;
            text-decoration: none;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        .prompt { font-style: italic; color: #5b4636; margin-top: 0.25rem; }
        .helptext { font-size: 0.85rem; color: #888; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'entries:list' %}">All entries</a>
        <a href="{% url 'entries:create' %}">New entry</a>
        <a href="/admin/">Admin</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
