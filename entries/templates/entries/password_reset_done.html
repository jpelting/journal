<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password - The Wax Tablet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            {% include "entries/_theme_vars.html" %}
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
        }
        .login-card {
            background: var(--wax-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem 2.25rem;
            width: 100%;
            max-width: 340px;
            box-shadow: var(--engrave-shadow), 0 4px 20px var(--shadow);
        }
        h1 {
            font-family: 'Cinzel', Georgia, 'Times New Roman', serif;
            font-size: 1.3rem;
            margin: 0 0 0.75rem;
            color: var(--accent);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        p { font-size: 0.9rem; color: var(--text-muted); text-align: center; }
        .btn {
            display: block;
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.6rem 1.2rem;
            background: var(--accent);
            color: var(--accent-contrast);
            text-decoration: none;
            text-align: center;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 16px 1px rgba(198, 139, 69, 0.35);
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }
        .btn:hover { background: var(--accent-hover); box-shadow: 0 0 22px 3px rgba(198, 139, 69, 0.5); }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Check Your Email</h1>
        <p>If an account exists for that address, we've sent a link to reset your password. It expires in a few hours.</p>
        <a class="btn" href="{% url 'login' %}">Back to log in</a>
    </div>
</body>
</html>
